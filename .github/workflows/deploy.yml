name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Syntax Compile Check
      run: |
        python -m py_compile bot.py handlers/*.py services/*.py database/*.py keyboards/*.py middlewares/*.py states/*.py

  build-and-deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Build verification step
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: pdf-bot:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Triggering auto-deploy webhooks (e.g. Render / Railway) if configured
    - name: Trigger Auto-Deploy Webhook
      if: env.DEPLOY_WEBHOOK != ''
      env:
        DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
      run: |
        curl -X POST "$DEPLOY_WEBHOOK"
